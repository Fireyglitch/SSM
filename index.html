
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedster Smash - HTML5 Platform Fighter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: linear-gradient(180deg, #1e3a8a 0%, #3b82f6 65%, #93c5fd 100%);
    }

    /* Loading Screen Styles */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e3a8a 0%, #090d16 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.45s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .game-logo {
      font-size: 46px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #facc15;
      text-shadow: 0 4px 0 #b45309, 0 8px 24px rgba(37, 99, 235, 0.9);
      margin-bottom: 24px;
    }
    .game-logo span {
      color: #60a5fa;
      text-shadow: 0 4px 0 #1d4ed8;
    }
    .ring-spinner {
      width: 64px;
      height: 64px;
      border: 8px solid #facc15;
      border-top-color: #fef08a;
      border-bottom-color: #ca8a04;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6), inset 0 0 10px rgba(250, 204, 21, 0.4);
      animation: spinRing 0.85s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spinRing {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    .progress-track {
      width: 340px;
      height: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #3b82f6;
      border-radius: 999px;
      overflow: hidden;
      padding: 2px;
      margin-bottom: 12px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #60a5fa, #facc15);
      border-radius: 999px;
      transition: width 0.12s ease-out;
    }
    #loading-status {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #93c5fd;
      text-transform: uppercase;
      min-height: 20px;
    }
    #start-btn {
      display: none;
      margin-top: 18px;
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      color: #0f172a;
      border: 2px solid #fef08a;
      padding: 12px 34px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.45);
      animation: pulseBtn 1.2s infinite;
    }
    #start-btn:hover {
      transform: scale(1.05);
    }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* HUD & Game Over Styles */
    #hud {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
